[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sipling"
version = "0.2.0"
description = "Be the phone: scriptable SIP testing for voice agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "sipling contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "build>=1"]

[project.scripts]
sipling = "sipling.cli:main"

[project.entry-points.pytest11]
sipling = "sipling.pytest_plugin"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires --live and SIPLING_TEST_URI", "integration: requires pjsua executable"]

[tool.hatch.build.targets.wheel]
packages = ["src/sipling"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/helpers", "/examples", "/docs", "/.github", "/pyproject.toml", "/README.md", "/LICENSE", "/SUMMARY.md"]
